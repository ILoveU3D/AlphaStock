[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "value-genie"
version = "1.0.0"
description = "Value Genie (价值投资精灵) - a full-market A/HK/US value-investment stock screener with an interactive web UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["stock-screener", "value-investing", "quant", "a-share", "hong-kong", "us-stocks"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "streamlit>=1.30",
    "plotly>=5.18",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["value_genie*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
