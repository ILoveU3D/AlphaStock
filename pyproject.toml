[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polar-star"
version = "1.0.0"
description = "Polar Star (北极星) - a full-market A/HK/US value-investment stock screener driven by AI agents through its CLI (no human UI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["stock-screener", "value-investing", "quant", "a-share", "hong-kong", "us-stocks"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["polar_star*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
